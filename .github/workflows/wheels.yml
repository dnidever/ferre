name: Build and test FERRE wheels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive and wheel
        run: |
          /opt/python/cp311-cp311/bin/python -m pip install build
          /opt/python/cp311-cp311/bin/python -m build
          /opt/python/cp311-cp311/bin/python tests/test_kernels.py
          FFLAGS="-O0 -g -fopenmp -fallow-argument-mismatch -fcheck=all" /opt/python/cp311-cp311/bin/python tests/test_kernels.py
          auditwheel repair --plat manylinux_2_28_x86_64 dist/*.whl -w wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheelhouse/*.whl

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build source archive and wheel
        shell: bash
        run: |
          brew install gcc
          export FC="$(brew --prefix gcc)/bin/gfortran"
          python -m pip install build delocate
          python -m build
          python tests/test_kernels.py
          delocate-wheel --require-archs ${{ matrix.arch }} -w wheelhouse dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl

  installed-test:
    needs: [linux, mac]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: wheels-linux-x86_64
          - runner: macos-15-intel
            artifact: wheels-macos-x86_64
          - runner: macos-15
            artifact: wheels-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse
      - name: Install wheel on a fresh runner
        run: |
          python -m pip install --only-binary=:all: --no-deps wheelhouse/*.whl
      - name: Fetch the pinned APOGEE example
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apogee-grid"
          for name in apogee-dr17-mgiant-full.hdr apogee-dr17-mgiant-full.unf apogee-dr17-mgiant-full-weights.json; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/dnidever/aspcap/8baa676afdb600483a5c41be9997071350fc6e44/aspcap/data/$name" -o "$RUNNER_TEMP/apogee-grid/$name"
          done
      - name: Test installed tools outside the checkout
        shell: bash
        env:
          FERRE_TEST_GRID_DIR: ${{ runner.temp }}/apogee-grid
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tests/test_install.py"
          python "$GITHUB_WORKSPACE/tests/test_sparse.py" -v
          python "$GITHUB_WORKSPACE/tests/test_apogee_sparse.py"
